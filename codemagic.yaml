workflows:
  android-build:
    name: Android Debug APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2 
    environment:
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Locate and Build APK
        script: | 
          # Find where gradlew is located
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in the repository!"
            exit 1
          fi

          # Move to the directory containing gradlew
          cd "$(dirname "$GRADLEW_PATH")"
          
          # Set up local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          # Build
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
    publishing:
      email:
        recipients:
          - ronniengoda@gmail.com
