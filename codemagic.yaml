# Codemagic CI configuration for M-Pesify (Free Tier)
workflows:
  android-build:
    name: Android Debug APK Build
    max_build_duration: 60
    # Use mac_mini_m2 for the 500 free monthly minutes
    instance_type: mac_mini_m2 
    environment:
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: | 
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - ronniengoda@gmail.com # Update this!
        notify:
          success: true
          failure: true
