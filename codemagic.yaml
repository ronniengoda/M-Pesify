workflows:
  android-build:
    name: Cordova Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2 
    environment:
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Install Cordova and Build
        script: | 
          # 1. Move to the Android platform folder
          # In Cordova projects, the actual Android project lives here:
          cd platforms/android
          
          # 2. Generate the wrapper here
          gradle wrapper
          
          # 3. Set up local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          # 4. Build the APK
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "platforms/android/app/build/outputs/apk/debug/*.apk"
    publishing:
      email:
        recipients:
          - ronniengoda@gmail.com
