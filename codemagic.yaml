# Codemagic CI configuration for M-Pesify
workflows:
  android-build:
    name: Android Debug APK Build
    max_build_duration: 60
    instance_type: linux_x2 # Standard Linux instance for faster Android builds
    environment:
      groups:
        - sdk_versions # Optional: useful if you define variables in the UI
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*' # This will build on any branch push
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: | 
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - ronniengoda@gmail.com # Replace with your email
        notify:
          success: true
          failure: true
