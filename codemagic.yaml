workflows:
  android-build:
    name: Android Debug APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2 
    environment:
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Generate Gradle Wrapper and Build
        script: | 
          # 1. Find the folder containing 'build.gradle'
          BUILD_FILE_PATH=$(find . -name "build.gradle" | head -n 1)
          
          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: No build.gradle found. Is this an Android project?"
            exit 1
          fi

          # 2. Move to that directory
          cd "$(dirname "$BUILD_FILE_PATH")"
          
          # 3. Generate the missing gradlew file
          gradle wrapper
          
          # 4. Set up local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          # 5. Build the APK
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
    publishing:
      email:
        recipients:
          - ronniengoda@gmail.com
